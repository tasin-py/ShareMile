<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" role="img" aria-label="ShareMile resource usage">
  <rect width="900" height="330" rx="16" fill="#0b0b0d"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#f4f4f5">Measured resource usage</text>
  <text x="40" y="66" font-size="13" fill="#a1a1aa">Private memory (bars) and CPU share of a 12-thread PC, ShareMile v1.0.0 on Windows 11</text>
  
  <text x="40" y="102" font-size="15" fill="#e4e4e7">Window open, idle</text>
  <rect x="250" y="80" width="520" height="34" rx="6" fill="#18181b"/>
  <rect x="250" y="80" width="399.1" height="34" rx="6" fill="#2ee6a6"/>
  <text x="659.1" y="102" font-size="15" fill="#f4f4f5" font-weight="600">154 MB</text>
  <text x="790" y="102" font-size="15" fill="#a1a1aa">CPU 0.09%</text>
  <text x="40" y="177" font-size="15" fill="#e4e4e7">Sharing, no transfer</text>
  <rect x="250" y="155" width="520" height="34" rx="6" fill="#18181b"/>
  <rect x="250" y="155" width="135.2" height="34" rx="6" fill="#2ee6a6"/>
  <text x="395.2" y="177" font-size="15" fill="#f4f4f5" font-weight="600">52 MB</text>
  <text x="790" y="177" font-size="15" fill="#a1a1aa">CPU 0.00%</text>
  <text x="40" y="252" font-size="15" fill="#e4e4e7">Serving ~640 MB/s</text>
  <rect x="250" y="230" width="520" height="34" rx="6" fill="#18181b"/>
  <rect x="250" y="230" width="137.5" height="34" rx="6" fill="#2ee6a6"/>
  <text x="397.5" y="252" font-size="15" fill="#f4f4f5" font-weight="600">53 MB</text>
  <text x="790" y="252" font-size="15" fill="#a1a1aa">CPU 7.83%</text>
  <text x="40" y="308" font-size="12" fill="#71717a">Rows 2-3 are the sharing engine alone (about 25 MB working set). Row 1 adds the WebView2 window processes.</text>
</svg>