<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Send to PC · ShareMile</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/share.css?v={{VERSION}}">
<link rel="stylesheet" href="/assets/phone.css?v={{VERSION}}">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <span class="brand"><img src="/assets/icon.png" alt=""><span>ShareMile</span></span>
    <span class="direct" title="Files go straight to the PC. Nothing is stored in a cloud."><i></i>Straight to the PC</span>
  </div>
</header>
<main class="wrap ph">
  <section class="ph-hero">
    <h1>Send files to <span id="pc">the PC</span></h1>
    <p class="muted">Pick photos, videos or any files. They're saved on the PC in ShareMile's “From phone” folder.</p>
  </section>

  <label class="drop ph-drop" id="drop">
    <input type="file" id="pick" multiple>
    <svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>
    <span><b>Choose files</b><br><small>Tap to pick, or drop files here</small></span>
  </label>

  <section class="ph-sum" id="sum" hidden>
    <div class="row between"><b id="sum-txt"></b><span class="muted num" id="sum-speed"></span></div>
    <div class="bar"><i id="sum-bar"></i></div>
    <p class="muted ph-hint" id="hint">Keep this page open until it says Done. If the connection drops, it carries on where it stopped.</p>
  </section>

  <ul class="ph-list" id="list"></ul>
  <p class="foot muted">Sent with ShareMile <span id="ver"></span></p>
</main>
<script src="/assets/phone.js?v={{VERSION}}"></script>
</body>
</html>
